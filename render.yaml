services:
  - type: web
    name: mera-mentor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: COMMISSION_L1
        value: "40"
      - key: COMMISSION_L2
        value: "12"
      - key: COMMISSION_L3
        value: "6"
      - key: COMMISSION_L4
        value: "3"
      - key: COMMISSION_L5
        value: "1"
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: INTEGRATION_PROXY_URL
        value: "https://integrations.emergentagent.com"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: mera-mentor
          property: host
